name: adl_reminder
description: Android-first reminder app with Ethiopian calendar support.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  record: ^7.1.1
  audioplayers: ^6.8.1
  vibration: ^3.2.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # SIL Open Font License; see assets/fonts/OFL-*.txt.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/space-grotesk-500.ttf
          weight: 500
        - asset: assets/fonts/space-grotesk-600.ttf
          weight: 600
        - asset: assets/fonts/space-grotesk-700.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm-sans-400.ttf
          weight: 400
        - asset: assets/fonts/dm-sans-500.ttf
          weight: 500
        - asset: assets/fonts/dm-sans-600.ttf
          weight: 600
        - asset: assets/fonts/dm-sans-700.ttf
          weight: 700
        - asset: assets/fonts/dm-sans-800.ttf
          weight: 800
